<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A meta refresh rather than a JavaScript redirect: GitHub Pages serves static files
     only, so there is no way to send a real 301, and this works with JS disabled.
     canonical tells search engines which page is the real one. -->
<meta http-equiv="refresh" content="0; url=/ferry/">
<link rel="canonical" href="https://ramanbanka.github.io/ferry/">
<title>Ferry — your Android phone, in Finder</title>
</head>
<body>
<p>Redirecting to <a href="/ferry/">Ferry</a>.</p>
</body>
</html>
